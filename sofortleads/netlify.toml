# sofortleads.de - dieser Ordner ist der vollstaendige Deploy-Stand, kein Build noetig
[build]
  publish = "."
  # Repo-Commits bauen sofortleads.de NICHT neu. Live-Stand kommt nur per Upload-Deploy.
  ignore = "exit 0"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
